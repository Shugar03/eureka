[package]
name = "eureka"
version = "0.2.1"
description = "Eureka: un tutor con IA que mide, planifica y enseña"
authors = ["Shugar03"]
license = "AGPL-3.0-only"
repository = "https://github.com/Shugar03/eureka"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "eureka_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time", "process", "fs"] }
futures-util = "0.3.34"
uuid = { version = "1.29.0", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
anyhow = "1.0.104"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "http2", "system-proxy", "multipart"] }
zip = { version = "9.1.2", default-features = false, features = ["deflate"] }
tauri-plugin-notification = "2"
sha2 = "0.11.1"
rusqlite = { version = "0.41", features = ["bundled", "functions"] }
ruzstd = "0.9.1"
sha1_smol = "1.0.1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Desktop only: phones have one instance by design and update through their store.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
# Local speech to text (Whisper on the CPU). Not on Android: see local_speech.rs.
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"

# Android: rustls with ring and built-in roots. The platform verifier reqwest uses
# elsewhere needs a JNI init Tauri doesn't do, and aws-lc-sys is fragile to cross-compile.
[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"


# Whisper in an unoptimized build is unusably slow: optimize the math crates only
# (optimizing every dependency runs out of memory compiling tauri/windows).
[profile.dev.package.candle-core]
opt-level = 3
[profile.dev.package.candle-nn]
opt-level = 3
[profile.dev.package.candle-transformers]
opt-level = 3
[profile.dev.package.gemm]
opt-level = 3
[profile.dev.package.gemm-common]
opt-level = 3
[profile.dev.package.gemm-f32]
opt-level = 3
[profile.dev.package.gemm-f16]
opt-level = 3
[profile.dev.package.half]
opt-level = 3
[profile.dev.package.safetensors]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Mutation testing (cargo-mutants): every mutant relinks the crate, and with
# Tauri the debug info dominates link time. No debug info = much faster.
[profile.mutants]
inherits = "dev"
debug = 0
